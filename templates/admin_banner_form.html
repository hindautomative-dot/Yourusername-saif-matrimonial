{% extends "base.html" %}
{% block title %}Add Banner{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block content %}

<section class="container-narrow">
    <h1 class="section-title">Add Banner</h1>

    <form method="POST" enctype="multipart/form-data" class="card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Slot *</label>
        <select name="slot" required>
            <option value="top">Top Strip (directly under navbar, every page — sponsor/offer)</option>
            <option value="hero">Hero (top of homepage)</option>
            <option value="mid">Mid-page (between sections)</option>
            <option value="footer">Lower homepage (above footer)</option>
        </select>

        <label>Title (optional, used as alt text)</label>
        <input type="text" name="title" placeholder="e.g. Eid Mubarak Special">

        <label>Link URL (optional — where it goes when tapped)</label>
        <input type="text" name="link_url" placeholder="https://wa.me/91XXXXXXXXXX">

        <label>Banner Image *</label>
        <input type="file" name="image" accept="image/*" required data-autoresize>
        <script src="{{ url_for('static', filename='js/photo-resize.js') }}"></script>
        <div class="helptext">Recommended: wide landscape image, up to 6 MB. It will be shown as-is (no cropping) inside a rounded card.</div>

        <div style="display:flex; gap:14px; margin-top:14px;">
            <div style="flex:1;">
                <label>Start Date (optional)</label>
                <input type="date" name="start_date">
            </div>
            <div style="flex:1;">
                <label>End Date (optional)</label>
                <input type="date" name="end_date">
            </div>
        </div>

        <label>Sort Order (lower shows first)</label>
        <input type="number" name="sort_order" value="0">

        <div style="margin-top:22px; display:flex; gap:10px;">
            <button class="btn btn-primary" type="submit">Save Banner</button>
            <a class="btn btn-outline" href="{{ url_for('admin_banners') }}">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
