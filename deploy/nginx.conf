# /etc/nginx/sites-available/saif-matrimonial
# Reverse proxy in front of Gunicorn. Adjust server_name, paths, and the
# upstream socket/port to match your actual deployment before enabling.
#
#   sudo ln -s /etc/nginx/sites-available/saif-matrimonial /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream saif_app {
    # Match this to how Gunicorn is bound in the systemd unit (systemd.service).
    # A unix socket avoids a TCP hop and is the usual choice on a single VPS.
    server unix:/run/saif-matrimonial/gunicorn.sock fail_timeout=0;
    # If you bind Gunicorn to a TCP port instead, use e.g.:
    # server 127.0.0.1:8000 fail_timeout=0;
}

# Rate-limit zones (defense in depth on top of the app's own per-IP limiter).
limit_req_zone $binary_remote_addr zone=saif_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=saif_upload:10m rate=2r/s;

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    # Redirect to HTTPS once a certificate is installed (certbot will add
    # the actual 443 server block and rewrite this automatically).
    # return 301 https://$host$request_uri;

    client_max_body_size 26m;  # a little above the app's own 25MB upload limit

    access_log /var/log/nginx/saif-matrimonial.access.log;
    error_log  /var/log/nginx/saif-matrimonial.error.log;

    # ---- Static files served directly by Nginx, never proxied to Flask ----
    location /static/ {
        alias /opt/saif-matrimonial/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        gzip_static on;
        access_log off;
    }

    # ---- Protected/private media (watermarked photos etc.) still goes
    #      through the app so the auth/watermark logic runs — do NOT alias
    #      this to a static location. ----

    # ---- Uploads that are served straight from disk once processed
    #      (previews, banners, branding) can also be aliased for speed if
    #      they live under a public static-ish path; keep behind Flask if
    #      you want per-request access checks. ----

    location / {
        limit_req zone=saif_general burst=40 nodelay;
        proxy_pass http://saif_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering on;
        proxy_read_timeout 65s;
        proxy_connect_timeout 10s;
    }

    # Heavier rate limit on submission endpoints (registration, payment
    # proof upload, OTP) — tune paths to match your actual routes.
    location ~* ^/(register-yourself|unlock|payment-proof|request-otp) {
        limit_req zone=saif_upload burst=5 nodelay;
        proxy_pass http://saif_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;  # don't buffer large photo uploads twice
        proxy_read_timeout 65s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
